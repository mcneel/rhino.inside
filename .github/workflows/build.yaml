name: Build
on:
  pull_request:
    branches: [ 'rhino-9.x' ]
  workflow_dispatch:

env:
  RHINO_TOKEN: ${{ secrets.RHINO_TOKEN }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install dotnet 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: dotnet build -c Release src/RhinoInside.sln

      - name: Install Rhino
        uses: mcneel/setup-rhino3d@v2
        id: setup_rhino
        with:
          release-version: wip
          email-address: ${{ secrets.EMAIL_ADDRESS }}

      - name: Run Tests (net48)
        shell: pwsh
        working-directory: ./src
        run: ./rhinoinside-tests.ps1 "C:\Program Files\Rhino 9 WIP\System" net48

      - name: Run Tests (net9.0-windows)
        shell: pwsh
        working-directory: ./src
        run: ./rhinoinside-tests.ps1 "C:\Program Files\Rhino 9 WIP\System" net9.0-windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhinoinside-nupkg
          path: src/build/*.nupkg

  publish:
    needs: [ build ]
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: rhinoinside-nupkg

      - name: Push packages to nuget.org
        run: dotnet nuget push '*.nupkg' --skip-duplicate -s https://api.nuget.org/v3/index.json -k ${{secrets.NUGET_API_KEY}}