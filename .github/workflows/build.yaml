name: Build & Release
on:
  pull_request:
    branches: [ 'rhino-9.x' ]
  workflow_dispatch:

env:
  RHINO_TOKEN: ${{ secrets.RHINO_TOKEN }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Update Version Numbers
        id: version_step
        run: ./src/version/version.sh

      - name: Upload versioned files
        uses: actions/upload-artifact@v7
        with:
          name: version-files
          path: |
            src/Directory.Build.props

  build:
    runs-on: windows-latest
    needs: [ version ]
    steps:
      - name: Get token
        if: (github.event_name == 'pull_request')
        id: my-app
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.MERGE_DOWN_APP_ID }}
          private_key: ${{ secrets.MERGE_DOWN_APP_PRIVATE_KEY }}

      - name: Enable Auto-Merge
        if: (github.event_name == 'pull_request')
        uses: kenhowardpdx/auto-merge-action@v1
        with:
          token: ${{ steps.my-app.outputs.token }}

      - name: Install dotnet 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Checkout code
        uses: actions/checkout@v7
  
      - name: Download versioned files
        uses: actions/download-artifact@v8
        with:
          name: version-files
          path: src/

      - name: Build
        run: dotnet build -c Release src/RhinoInside.sln

      - name: Install Rhino
        uses: mcneel/setup-rhino3d@v4
        with:
          major-version: 9
          email-address: ${{ secrets.EMAIL_ADDRESS }}

      - name: Run Tests (net48)
        shell: pwsh
        working-directory: ./src
        run: ./rhinoinside-tests.ps1 "C:\Program Files\Rhino 9\System" net48

      - name: Run Tests (net10.0-windows)
        shell: pwsh
        working-directory: ./src
        run: ./rhinoinside-tests.ps1 "C:\Program Files\Rhino 9\System" net10.0-windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rhinoinside-nupkg
          path: src/build/*.nupkg

  build-mac:
    runs-on: [self-hosted, macos]
    needs: [ version ]
    steps:
      - name: Install dotnet 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download versioned files
        uses: actions/download-artifact@v8
        with:
          name: version-files
          path: src/

      - name: Build
        run: dotnet build -c Release src/RhinoInside.sln

      - name: Install Rhino
        uses: mcneel/setup-rhino3d@v4
        with:
          major-version: 9
          email-address: ${{ secrets.EMAIL_ADDRESS }}

      - name: Run Tests (net10.0)
        working-directory: ./src
        run: ./rhinoinside-tests-netcore "/Applications/Rhino 9.app"

  tag:
    needs: [ version, build, build-mac ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rhino-9.x'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag
        run: |
          TAG="v${{ needs.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  publish:
    needs: [ build, tag ]
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write # needed for NuGet trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: rhinoinside-nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        run: dotnet nuget push '*.nupkg' --skip-duplicate -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }}