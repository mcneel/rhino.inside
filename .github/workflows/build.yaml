name: Build & Release
on:
  pull_request:
    branches: [ 'rhino-9.x' ]
  workflow_dispatch:

env:
  RHINO_TOKEN: ${{ secrets.RHINO_TOKEN }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Update Version Numbers
        id: version_step
        run: ./src/version/version.sh

      - name: Upload versioned files
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            src/Directory.Build.props

  build:
    runs-on: windows-latest
    needs: [ version ]
    steps:
      - name: Get token
        if: (github.event_name == 'pull_request')
        id: my-app
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.MERGE_DOWN_APP_ID }}
          private_key: ${{ secrets.MERGE_DOWN_APP_PRIVATE_KEY }}

      - name: Enable Auto-Merge
        if: (github.event_name == 'pull_request')
        uses: kenhowardpdx/auto-merge-action@v1
        with:
          token: ${{ steps.my-app.outputs.token }}

      - name: Install dotnet 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Download versioned files
        uses: actions/download-artifact@v4
        with:
          name: version-files
          path: src/

      - name: Build
        run: dotnet build -c Release src/RhinoInside.sln

      - name: Install Rhino
        uses: mcneel/setup-rhino3d@v3.0.0
        id: setup_rhino
        with:
          release-version: wip
          email-address: ${{ secrets.EMAIL_ADDRESS }}

      - name: Run Tests (net48)
        shell: pwsh
        working-directory: ./src
        run: ./rhinoinside-tests.ps1 "C:\Program Files\Rhino 9 WIP\System" net48

      - name: Run Tests (net9.0-windows)
        shell: pwsh
        working-directory: ./src
        run: ./rhinoinside-tests.ps1 "C:\Program Files\Rhino 9 WIP\System" net9.0-windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhinoinside-nupkg
          path: src/build/*.nupkg

  build-macos:
    runs-on: macos-latest
    needs: [ version ]
    steps:
      - name: Install dotnet 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download versioned files
        uses: actions/download-artifact@v4
        with:
          name: version-files
          path: src/

      - name: Build
        run: dotnet build -c Release src/RhinoInside.sln

      - name: Install Rhino WIP
        uses: mcneel/setup-rhino3d@v3.0.0
        with:
          release-version: wip
          email-address: ${{ secrets.EMAIL_ADDRESS }}

      - name: Run Tests (net10.0)
        working-directory: ./src
        run: |
          RHINOINSIDE_RHINOPATH="$(ls -d /Applications/Rhino*.app/Contents/Frameworks | head -1)"
          echo "Using RHINOINSIDE_RHINOPATH=$RHINOINSIDE_RHINOPATH"
          RHINOINSIDE_RHINOPATH="$RHINOINSIDE_RHINOPATH" dotnet test RhinoInside.sln /tl:off --framework net10.0

  tag:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rhino-9.x'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag
        run: |
          TAG="v${{ needs.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  publish:
    needs: [ build, tag ]
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: rhinoinside-nupkg

      - name: Push packages to nuget.org
        run: dotnet nuget push '*.nupkg' --skip-duplicate -s https://api.nuget.org/v3/index.json -k ${{secrets.NUGET_API_KEY}}